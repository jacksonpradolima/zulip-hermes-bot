site_name: Zulip Hermes Integration
site_description: Generic Zulip MCP tools and bot bridge for Hermes Agent
site_url: https://jacksonpradolima.github.io/zulip-hermes-bot/
repo_url: https://github.com/jacksonpradolima/zulip-hermes-bot
repo_name: jacksonpradolima/zulip-hermes-bot
edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Follow system preference

nav:
  - Home: index.md
  - User Guide:
      - Installation: installation.md
      - Configuration: configuration.md
      - MCP Tools: mcp-tools.md
      - Bot Bridge: bot-bridge.md
  - Development:
      - Architecture: architecture.md
      - Contributing: contributing.md
      - Security: security.md
  - API Reference:
      - MCP Server: api/mcp-server.md
      - Bot Bridge: api/bot-bridge.md
      - CLI: api/cli.md
      - Query Helper: api/query.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jacksonpradolima/zulip-hermes-bot
